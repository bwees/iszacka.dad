# Production deploy: every push to main (or a manual run) typechecks, tests, resolves the
# D1 database by name, applies migrations, deploys the Worker to iszacka.dad, syncs the
# Worker secrets from GitHub secrets, and finally smoke-tests production (read-only).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One production deploy at a time, in order. Never cancel one halfway through a migration.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: "false"
  FORCE_COLOR: "0"
  SITE_URL: https://iszacka.dad

jobs:
  deploy:
    name: Deploy to iszacka.dad
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://iszacka.dad
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Check Cloudflare credentials
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z ${!name:-} ]]; then
              echo "::error title=Missing secret::$name isn't set. See docs/SETUP.md."
              missing=1
            fi
          done
          [[ $missing == 0 ]] || exit 1

          # Probe what the token can actually do. This repo's Actions logs are public, so only
          # pass/fail and Cloudflare error codes are printed: never ids, names or response bodies.
          api() { curl -sS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          probe() { # <label> <path> → prints ✅/❌ and returns 0/1
            local body ok code
            body=$(api "$2" || echo '{}')
            ok=$(jq -r '.success // false' <<<"$body" 2>/dev/null || echo false)
            code=$(jq -r '[.errors[]?.code] | map(tostring) | join(",")' <<<"$body" 2>/dev/null || true)
            if [[ $ok == true ]]; then echo "✅ $1"; return 0; fi
            echo "❌ $1${code:+ (Cloudflare error $code)}"; return 1
          }
          shape=no; [[ $CLOUDFLARE_ACCOUNT_ID =~ ^[0-9a-f]{32}$ ]] && shape=yes
          echo "CLOUDFLARE_ACCOUNT_ID looks like a 32-character hex id: $shape"
          user_tok=0; acct_tok=0
          probe "token is a valid user API token" "/user/tokens/verify" && user_tok=1 || true
          probe "token is a valid account API token for CLOUDFLARE_ACCOUNT_ID" "/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" && acct_tok=1 || true
          failed=0
          probe "D1 (list databases) on CLOUDFLARE_ACCOUNT_ID" "/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=1" || failed=1
          probe "Workers Scripts (list) on CLOUDFLARE_ACCOUNT_ID" "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" || failed=1
          probe "zone ${SITE_URL#https://} is visible" "/zones?name=${SITE_URL#https://}" || failed=1
          zone_id=$(api "/zones?name=${SITE_URL#https://}" | jq -r '.result[0].id // empty' 2>/dev/null || true)
          if [[ -n $zone_id ]]; then
            echo "✅ zone ${SITE_URL#https://} found"
            probe "Workers Routes (list) on the zone" "/zones/$zone_id/workers/routes" || failed=1
            # Needed by the Setup workflow, not by this deploy: report, don't fail.
            probe "DNS (list records) on the zone [setup job]" "/zones/$zone_id/dns_records?per_page=1" || echo "::warning title=Cloudflare token::No DNS access; the Setup workflow needs DNS Edit."
          else
            echo "❌ zone ${SITE_URL#https://} not found (is it in this account, and is the token scoped to it?)"; failed=1
          fi
          probe "Turnstile (list widgets) [setup job]" "/accounts/$CLOUDFLARE_ACCOUNT_ID/challenges/widgets?per_page=1" || echo "::warning title=Cloudflare token::No Turnstile access; the Setup workflow needs Turnstile Edit."
          if [[ $user_tok == 0 && $acct_tok == 0 ]]; then
            echo "::error title=Cloudflare token::CLOUDFLARE_API_TOKEN isn't a valid token (neither user nor account token)."
            exit 1
          fi
          if [[ $failed == 1 ]]; then
            echo "::error title=Cloudflare token::The token can't do everything the deploy needs; see the ❌ lines above and docs/SETUP.md for the permission list."
            exit 1
          fi

      - name: Resolve the D1 database
        id: d1
        run: bash .github/scripts/ensure-d1.sh iszackadad PLACEHOLDER_D1_ID

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply iszackadad --remote --env=""

      - name: Deploy the Worker
        env:
          DEPLOY_SHA: ${{ github.sha }}
        # --env="" picks the top-level (production) config explicitly; [env.preview] is for PRs.
        run: npx wrangler deploy --env="" --message "GitHub Actions deploy of ${DEPLOY_SHA:0:12}"

      # The Worker has to exist before it can have secrets, so these go after the first deploy.
      # A secret that isn't set in GitHub is left alone on the Worker (never deleted).
      # TURNSTILE_SITE_KEY, TURNSTILE_SECRET_KEY and RESEND_WEBHOOK_SECRET belong to the Setup
      # workflow (scripts/setup-cloudflare.sh); they're only synced from GitHub if someone set
      # them there on purpose, as overrides.
      - name: Sync Worker secrets
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # The deploy token has DNS Edit on the zone, so it doubles as the Worker's DNS token
          # unless a narrower DNS_API_TOKEN secret is set (which then takes precedence).
          DNS_API_TOKEN: ${{ secrets.DNS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          DNS_ZONE_ID: ${{ secrets.DNS_ZONE_ID }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
        run: |
          for name in ADMIN_PASSWORD RESEND_API_KEY DNS_API_TOKEN DNS_ZONE_ID TURNSTILE_SITE_KEY TURNSTILE_SECRET_KEY RESEND_WEBHOOK_SECRET; do
            value=${!name:-}
            if [[ -z $value ]]; then
              case $name in
                ADMIN_PASSWORD)
                  echo "::warning title=No admin password::ADMIN_PASSWORD isn't set in GitHub secrets. Unless the Worker already has one, /admin stays locked." ;;
                RESEND_API_KEY)
                  echo "::warning title=No Resend key::RESEND_API_KEY isn't set in GitHub secrets. Unless the Worker already has one, no email goes out." ;;
                DNS_API_TOKEN | DNS_ZONE_ID)
                  echo "::notice title=Secret skipped::$name isn't set in GitHub secrets; leaving the Worker's value (if any) alone." ;;
                *)
                  echo "$name: managed by the Setup workflow; not overridden from GitHub." ;;
              esac
              continue
            fi
            printf '%s' "$value" | npx wrangler secret put "$name" --env=""
          done

      # Brand new custom domains can take a few minutes to get a certificate, so wait for the
      # site to answer before judging it.
      - name: Wait for production
        run: |
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$SITE_URL/api/status" || true)
            if [[ $code == 200 ]]; then
              echo "$SITE_URL is answering."
              exit 0
            fi
            sleep 5
          done
          echo "::error title=Production unreachable::$SITE_URL/api/status didn't return 200 within 5 minutes."
          exit 1

      - name: Smoke test production (read-only)
        run: bash scripts/smoke.sh "$SITE_URL"

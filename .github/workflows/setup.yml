# One-time (and safely re-runnable) Cloudflare + Resend setup: runs scripts/setup-cloudflare.sh
# with the repository secrets. It adds the iszacka.dad domain to Resend with its DNS records,
# points inbound mail at Resend, creates the Resend webhook and the Turnstile widget, and stores
# their secrets on the Worker. Run it by hand from the Actions tab, after the first deploy (the
# Worker has to exist before it can hold secrets). See docs/SETUP.md.
name: Setup

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only look, change nothing
        type: boolean
        default: false
      force_secrets:
        description: Re-store the webhook and Turnstile secrets on the Worker
        type: boolean
        default: false

permissions:
  contents: read

# Storing a Worker secret deploys a new version, so never race a production deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: "false"
  FORCE_COLOR: "0"

jobs:
  setup:
    name: Set up Cloudflare and Resend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://iszacka.dad
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - name: Check secrets
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID RESEND_API_KEY; do
            if [[ -z ${!name:-} ]]; then
              echo "::error title=Missing secret::$name isn't set. See docs/SETUP.md."
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # For `npx wrangler` (secret list / secret put).
      - name: Install dependencies
        run: npm ci

      - name: Run the setup script
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE_SECRETS: ${{ inputs.force_secrets }}
        run: |
          args=()
          if [[ $DRY_RUN == true ]]; then args+=(--dry-run); fi
          if [[ $FORCE_SECRETS == true ]]; then args+=(--force-secrets); fi
          bash scripts/setup-cloudflare.sh "${args[@]}"

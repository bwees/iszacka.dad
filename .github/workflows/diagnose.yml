name: Diagnose

# Manual troubleshooting for production. This repo is PUBLIC, so its Actions logs are too:
# everything printed here is redacted (no email addresses, subjects, tokens, ids or bodies).
on:
  workflow_dispatch:
    inputs:
      tail_minutes:
        description: How long to tail the Worker (minutes)
        type: number
        default: 8

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"
  FORCE_COLOR: "0"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci

      - name: Resend (redacted)
        run: |
          r() { curl -sS --max-time 20 -H "Authorization: Bearer $RESEND_API_KEY" -H "User-Agent: iszacka.dad diagnose" "https://api.resend.com$1"; }
          echo "── Domains"
          r /domains | jq -r '.data[]? | "\(.name): status=\(.status) sending=\(.capabilities.sending // "?") receiving=\(.capabilities.receiving // "?")"'
          echo "── Webhooks"
          r /webhooks | jq -r '.data[]? | "endpoint=\(.endpoint) status=\(.status) events=\(.events | join(","))"'
          echo "── Latest received emails (addresses and subjects redacted)"
          r "/emails/receiving?limit=5" | jq -r '
            if .data then .data[] | "\(.created_at)  to-domain=\([.to[]? | sub(".*@";"")] | unique | join(","))  id=…\(.id[-4:])"
            else "list failed: \(.name // "?") \(.message // "" | gsub("[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+";"<email>"))" end'
          echo "── Latest sent emails (recipients redacted to their domain)"
          r "/emails?limit=8" | jq -r '
            if .data then .data[] | "\(.created_at)  from=\(.from | sub(".*<";"") | sub(">.*";""))  to-domain=\([.to[]? | sub(".*@";"") | sub(">.*";"")] | unique | join(","))  last_event=\(.last_event // "?")"
            else "list failed: \(.name // "?") \(.message // "" | gsub("[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+";"<email>"))" end'
          id=$(r "/emails/receiving?limit=1" | jq -r '.data[0].id // empty')
          if [[ -n $id ]]; then
            echo "── Newest received email: authentication + header flags"
            r "/emails/receiving/$id" | jq -c '{
              authentication,
              has_text: ((.text // "") != ""),
              header_keys: ((.headers // {}) | keys | map(ascii_downcase) | map(select(test("^(auto-submitted|precedence|list-id|return-path|x-auto-response-suppress)$"))))
            }'
          fi

      - name: Database (redacted)
        run: |
          bash .github/scripts/ensure-d1.sh iszackadad PLACEHOLDER_D1_ID >/dev/null
          q() { npx wrangler d1 execute iszackadad --remote --env="" --json --command "$1" 2>/dev/null | jq -c '.[0].results'; }
          echo "resend_events:  $(q "SELECT type, at FROM resend_events ORDER BY at DESC LIMIT 10")"
          echo "inbound_emails: $(q "SELECT kind, at FROM inbound_emails ORDER BY id DESC LIMIT 10")"
          echo "email_sends:    $(q "SELECT day, n FROM email_sends ORDER BY day DESC LIMIT 3")"
          echo "settings keys:  $(q "SELECT key, updated_at FROM settings ORDER BY key")"

      - name: Tail the Worker while the smoke test runs (redacted)
        env:
          MINUTES: ${{ inputs.tail_minutes }}
        if: ${{ inputs.tail_minutes > 0 }}
        run: |
          set +e
          timeout "${MINUTES}m" npx wrangler tail iszacka-dad --env="" --format json > tail.json 2> tail.err &
          tail_pid=$!
          sleep 20
          bash scripts/smoke.sh https://iszacka.dad > smoke.txt 2>&1
          echo "smoke: $(tail -2 smoke.txt | head -1)"
          wait "$tail_pid"
          echo "── Events (one per line; emails, tokens and query strings redacted)"
          jq -c '
            def red: tostring | gsub("[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+"; "<email>");
            {
              t: ((.eventTimestamp // 0) / 1000 | floor | todate),
              outcome,
              cpu: (.cpuTime // null),
              wall: (.wallTime // null),
              entry: (.entrypoint // .scriptName // null),
              method: (.event.request.method? // null),
              path: ((.event.request.url? // "") | sub("^https?://[^/]+"; "") | sub("\\?.*$"; "") | sub("/(?<k>unsubscribe|confirm|webhooks)/[^/]+"; "/\(.k)/…")),
              status: (.event.response.status? // null),
              cron: (.event.cron? // null),
              logs: [.logs[]? | .message | map(red) | join(" ") | .[0:240]],
              exceptions: [.exceptions[]? | ((.name // "") + ": " + (.message // "")) | red | .[0:240]]
            }' tail.json > events.jsonl
          cat events.jsonl
          echo "── Outcomes"
          jq -r '.outcome' events.jsonl | sort | uniq -c
          echo "── CPU ms by path (max / count), worst first"
          jq -r 'select(.cpu != null) | "\(.cpu)\t\(.method // "-") \(.path // .entry)"' events.jsonl \
            | awk -F'\t' '{k=$2; if ($1>m[k]) m[k]=$1; c[k]++} END {for (k in m) printf "%6.1f ms  x%-3d %s\n", m[k], c[k], k}' | sort -rn | head -40
          echo "── tail stderr (first lines)"
          head -5 tail.err | sed -E 's/[0-9a-f]{32}/<id>/g'
